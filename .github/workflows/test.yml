name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-24.04 # Playwright 1.49 system deps target 24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright (test-only, not a runtime dependency)
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run unit and end-to-end tests
        run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
