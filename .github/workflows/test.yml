name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not a runtime dependency)
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Run unit and end-to-end tests
        run: npm test
